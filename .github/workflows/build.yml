name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build SoundBurst.sln -c Release

      - name: Publish (win-x64)
        run: >
          dotnet publish src/SoundBurst.App/SoundBurst.App.csproj
          -c Release -r win-x64 --self-contained true
          -o artifacts/publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundBurst-win-x64
          path: artifacts/publish

  # Driver builds require WDK and are intentionally manual / self-hosted for now.
  # See driver/SoundBurstVad/README.md and scripts/*.ps1
